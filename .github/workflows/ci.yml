name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=chromium --project=mobile --project=golden
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  cross-engine-smoke:
    name: ${{ matrix.engine }} Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: Firefox
            project: firefox-smoke
            browser: firefox
          - engine: WebKit
            project: webkit-smoke
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }} --with-deps
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  bench:
    name: Export Benchmark
    runs-on: ubuntu-latest
    # Reports, does not gate. A shared runner's wall clock is too noisy to fail
    # a PR on, and #88's own instruction is that nothing be optimised without a
    # number before and after — this is where that number comes from, attached
    # to the PR instead of retyped from someone's laptop. The harness reports
    # the minimum of several runs precisely because the mean would measure the
    # runner.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run benchmark
        run: npm run bench -- --repeat=3 | tee bench.txt
      - name: Summarise
        run: |
          {
            echo '### Export pipeline benchmark'
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run bench -- --repeat=3 --json > bench.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: |
            bench.txt
            bench.json
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:landing-budget
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  clarity:
    name: Clarity Legibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/checkout@v7
        with:
          repository: kmatzen/clarity
          # Pinned revision adding deterministic --init-script/API support.
          ref: 7e134bc049bc728e706eed41b3a85e9bf9dba152
          path: .clarity
      - name: Build pinned Clarity
        working-directory: .clarity
        run: npm ci --ignore-scripts && npm run build
      - name: Install Clarity browser
        working-directory: .clarity
        run: npx playwright install chromium --with-deps
      - name: Audit representative Sinter surfaces
        env:
          CLARITY_MODULE: ../.clarity/dist/index.js
        run: node scripts/check-clarity.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clarity-report
          path: clarity-report.json
          if-no-files-found: ignore
          retention-days: 30
